name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dashboard:
    name: Dashboard (typecheck, lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        working-directory: dashboard
        run: npx oxlint src

      - name: Run tests
        working-directory: dashboard
        run: npm test

  mobile:
    name: Mobile (test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests
        working-directory: mobile
        run: npm test
